<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Enevo</title>
    <link rel="stylesheet" href="../assets/style/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ====== CONTENEDOR PRINCIPAL ====== -->
    <div class="register-container">
      <div class="register-box">
        <img
          src="../assets/img/LogoEnevo.png"
          alt="Logo Enevo"
          class="register-logo"
        />
        <h2>Crear cuenta</h2>

        <form
          action="../assets/app/controllers/AuthController.php"
          method="POST"
        >
          <input type="hidden" name="action" value="register" />

          <input
            type="text"
            name="nombre"
            placeholder="Nombre completo"
            required
          />
          <input
            type="email"
            name="email"
            placeholder="Correo electrónico"
            required
          />
          <div class="password-field">
            <input
              type="password"
              name="password"
              placeholder="Contraseña"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div class="password-field">
            <input
              type="password"
              name="confirm_password"
              placeholder="Confirmar contraseña"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              aria-label="Mostrar confirmación de contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn-register-main">Registrarse</button>
        </form>

        <p class="text-alt">
          ¿Ya tienes una cuenta?
          <a href="login.html" class="link-login">Iniciar sesión</a>
        </p>

        <a href="../index.html" class="back-store-link">← Volver a la tienda</a>
      </div>
    </div>

    <!-- ====== FOOTER ====== -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-logo">
          <img src="../assets/img/LogoEnevo.png" alt="Logo Enevo" />
        </div>
        <p>© 2025 - Todos los derechos reservados</p>
      </div>
    </footer>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
