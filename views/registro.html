<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta — Enevo</title>
    <link rel="stylesheet" href="../assets/style/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ====== CONTENEDOR PRINCIPAL ====== -->
    <div class="register-container">
      <div class="register-box">
        <img
          src="../assets/img/LogoEnevo.png"
          alt="Logo Enevo"
          class="register-logo"
        />
        <h2>Crear cuenta</h2>

        <form
          action="../assets/app/controllers/AuthController.php"
          method="POST"
          novalidate
        >
          <input type="hidden" name="action" value="register" />

          <label for="registerNombre" class="form-field-label">Nombre completo</label>
          <input
            id="registerNombre"
            type="text"
            name="nombre"
            placeholder="Tu nombre"
            autocomplete="name"
            maxlength="100"
            required
          />
          <label for="registerEmail" class="form-field-label">Correo electrónico</label>
          <input
            id="registerEmail"
            type="email"
            name="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            required
          />
          <label for="registerPassword" class="form-field-label">Contraseña</label>
          <div class="password-field">
            <input
              id="registerPassword"
              type="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              minlength="6"
              aria-describedby="passwordHints"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <label for="registerConfirmPassword" class="form-field-label">Confirmar contraseña</label>
          <div class="password-field">
            <input
              id="registerConfirmPassword"
              type="password"
              name="confirm_password"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              minlength="6"
              aria-describedby="passwordHints"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              aria-label="Mostrar confirmación de contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <ul id="passwordHints" class="password-hints" aria-live="polite">
            <li id="hintMinLen">Mínimo 6 caracteres</li>
            <li id="hintMatch">Las contraseñas coinciden</li>
          </ul>

          <button type="submit" class="btn-register-main">Registrarse</button>
        </form>

        <p class="text-alt">
          ¿Ya tienes una cuenta?
          <a href="login.html" class="link-login">Iniciar sesión</a>
        </p>

        <a href="../index.html" class="back-store-link">← Volver a la tienda</a>
      </div>
    </div>

    <!-- ====== FOOTER ====== -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-logo">
          <img src="../assets/img/LogoEnevo.png" alt="Logo Enevo" loading="lazy" decoding="async" />
        </div>
        <p>© 2025 - Todos los derechos reservados</p>
      </div>
    </footer>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
