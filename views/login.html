<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión — Enevo</title>
    <link rel="stylesheet" href="../assets/style/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ====== CONTENEDOR PRINCIPAL ====== -->
    <div class="login-container">
      <div class="login-box">
        <img
          src="../assets/img/LogoEnevo.png"
          alt="Logo Enevo"
          class="login-logo"
        />
        <h3>Iniciar sesión</h3>

        <form
          action="../assets/app/controllers/AuthController.php"
          method="POST"
          novalidate
        >
          <input type="hidden" name="action" value="login" />
          <label for="loginEmail" class="form-field-label">Correo electrónico</label>
          <input
            id="loginEmail"
            type="email"
            name="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            required
          />
          <label for="loginPassword" class="form-field-label">Contraseña</label>
          <div class="password-field">
            <input
              id="loginPassword"
              type="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-password-btn"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
              title="Mostrar contraseña"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="divider">
          <hr />
          <span>o</span>
          <hr />
        </div>

        <button
          class="btn-register"
          onclick="window.location.href='registro.html'"
        >
          Registrarse
        </button>

        <a href="../index.html" class="back-store-link">← Volver a la tienda</a>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-logo">
          <img src="../assets/img/LogoEnevo.png" alt="Logo Enevo" loading="lazy" decoding="async" />
        </div>
        <p>© 2025 - Todos los derechos reservados</p>
      </div>
    </footer>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
